<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySOPK - App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Palette MySOPK */
            --primary: #B06D85; /* Vieux Rose */
            --primary-light: #FFF0F5;
            --sage: #7D9D8A; /* Vert Sauge */
            --sage-light: #E8F3EB;
            --gold: #D4A373; 
            --bg-gradient: linear-gradient(135deg, #fffcfd 0%, #fff4f6 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #4A4A4A;
            --shadow: 0 10px 30px rgba(176, 109, 133, 0.15);
            --radius: 24px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #app-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER & NAV --- */
        header {
            padding: 20px;
            text-align: center;
            background: white;
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; color: var(--primary);
            font-weight: 600; letter-spacing: 1px;
        }

        /* --- CONTENU --- */
        .content {
            flex: 1;
            padding: 20px;
            padding-bottom: 90px; /* Espace pour la bottom bar */
            overflow-y: auto;
        }

        h2 { font-family: 'Playfair Display'; color: var(--primary); margin-top: 0; }
        h3 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 10px; }

        /* --- DIAGNOSTIC STYLES --- */
        .diag-progress { height: 6px; background: #eee; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .diag-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        
        .option-btn {
            background: white; border: 1px solid #eee; padding: 15px; border-radius: 15px;
            width: 100%; text-align: left; margin-bottom: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: all 0.2s;
            font-size: 0.95rem;
        }
        .option-btn:hover, .option-btn.selected {
            background: var(--primary-light); border-color: var(--primary); color: var(--primary);
        }

        /* --- NUTRITION CARDS --- */
        .food-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .food-img { width: 100%; height: 160px; object-fit: cover; }
        .food-content { padding: 15px; }
        .food-tag { 
            background: var(--sage-light); color: var(--sage); 
            padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
        }

        /* --- ZEN SPACE (COEUR) --- */
        .zen-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center;
        }
        
        /* Cœur CSS avec bords diffus */
        .heart-wrapper {
            position: relative; width: 120px; height: 120px;
            margin: 50px auto;
            animation: breathe 5s infinite ease-in-out paused; /* Pausé par défaut */
        }
        .heart {
            background-color: var(--primary);
            display: inline-block;
            height: 120px; width: 120px;
            position: relative; top: 0;
            transform: rotate(-45deg);
            /* Effet diffus */
            box-shadow: 0 0 40px 20px rgba(176, 109, 133, 0.4); 
            filter: blur(1px);
        }
        .heart:before, .heart:after {
            content: "";
            background-color: var(--primary);
            border-radius: 50%;
            height: 120px; width: 120px;
            position: absolute;
        }
        .heart:before { top: -60px; left: 0; }
        .heart:after { left: 60px; top: 0; }

        .running .heart-wrapper { animation-play-state: running; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 60px 30px rgba(176, 109, 133, 0.6); }
        }

        /* --- CONSEILS / STRESS --- */
        .advice-list { display: grid; gap: 15px; }
        .advice-item {
            background: white; padding: 15px; border-radius: 15px;
            border-left: 4px solid var(--sage); display: flex; gap: 15px; align-items: start;
        }
        .advice-icon { 
            font-size: 1.5rem; color: var(--sage); background: var(--sage-light);
            padding: 10px; border-radius: 50%;
        }

        /* --- BOTTOM BAR --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: white; padding: 10px 20px;
            display: flex; justify-content: space-between;
            border-top: 1px solid #eee; box-shadow: 0 -5px 20px rgba(0,0,0,0.02);
            z-index: 100;
        }
        .nav-btn {
            background: none; border: none;
            display: flex; flex-direction: column; align-items: center;
            color: #aaa; font-size: 0.75rem; cursor: pointer; gap: 4px;
        }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 2px; }
        .nav-btn.active { color: var(--primary); }

        /* UTILS */
        .hidden { display: none !important; }
        .btn-main {
            background: var(--primary); color: white; border: none;
            padding: 15px 30px; border-radius: 50px; font-size: 1rem;
            width: 100%; margin-top: 20px; cursor: pointer;
        }
        .btn-outline {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 10px 20px; border-radius: 50px; margin-top: 10px; cursor: pointer;
        }

    </style>
</head>
<body>

<div id="app-wrapper">
    <header>
        <div class="logo">MySOPK 🌸</div>
    </header>

    <div id="main-content" class="content">
        </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="router('home')">
            <i class="ph ph-house"></i> Accueil
        </button>
        <button class="nav-btn" onclick="router('diag')">
            <i class="ph ph-clipboard-text"></i> Bilan
        </button>
        <button class="nav-btn" onclick="router('nutrition')">
            <i class="ph ph-bowl-food"></i> Nutrition
        </button>
        <button class="nav-btn" onclick="router('stress')">
            <i class="ph ph-brain"></i> Conseils
        </button>
        <button class="nav-btn" onclick="router('zen')">
            <i class="ph ph-heart"></i> Zen
        </button>
    </nav>
</div>

<audio id="zen-audio" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/10/05/audio_68629e8c34.mp3" type="audio/mpeg">
</audio>

<script>
    // --- DONNÉES & IMAGES ---
    const images = {
        salmon: 'https://images.unsplash.com/photo-1599084993091-1cb5c0721cc6?q=80&w=1000',
        chocolate: 'https://images.unsplash.com/photo-1606312619070-d48b706521bf?q=80&w=1000',
        yoga: 'https://images.unsplash.com/photo-1544367563-12123d8965cd?q=80&w=1000'
    };

    // --- ETAT GLOBAL ---
    let state = {
        view: 'home',
        diagAnswers: [],
        quizDone: false
    };

    // --- ROUTER ---
    function router(viewName) {
        state.view = viewName;
        // Update Nav UI
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        // Simple logic to highlight nav based on view approx
        const navMap = {'home':0, 'diag':1, 'result':1, 'nutrition':2, 'stress':3, 'zen':4};
        if(navMap[viewName] !== undefined) document.querySelectorAll('.nav-btn')[navMap[viewName]].classList.add('active');

        render();
    }

    // --- RENDER ENGINE ---
    function render() {
        const container = document.getElementById('main-content');
        container.innerHTML = '';

        if (state.view === 'home') renderHome(container);
        else if (state.view === 'diag') renderDiagStart(container);
        else if (state.view === 'diag-question') renderDiagQuestion(container);
        else if (state.view === 'result') renderResult(container);
        else if (state.view === 'nutrition') renderNutrition(container);
        else if (state.view === 'stress') renderStress(container);
        else if (state.view === 'zen') renderZen(container);
    }

    // --- VUES ---

    // 1. HOME & QUIZ DU JOUR
    function renderHome(container) {
        container.innerHTML = `
            <div style="text-align:center; padding: 20px 0;">
                <h2>Bonjour, belle âme ✨</h2>
                <p style="color:#777;">Prête pour ta journée d'équilibre ?</p>
            </div>

            <div class="food-card" style="background:var(--primary-light); border: 1px solid var(--primary);">
                <div class="food-content" style="text-align:center;">
                    <h3>📅 Le Quiz du Jour</h3>
                    ${state.quizDone ? 
                        `<p>✅ Bravo ! Tu as validé ton quiz aujourd'hui.</p>
                         <button class="btn-outline" onclick="resetQuiz()">Refaire le quiz</button>` 
                        : 
                        `<p>As-tu pris ton petit-déjeuner salé ce matin ?</p>
                         <div style="display:flex; gap:10px; margin-top:15px;">
                            <button class="btn-main" onclick="finishDailyQuiz(true)" style="background:var(--sage); margin:0;">Oui ! 🥑</button>
                            <button class="btn-main" onclick="finishDailyQuiz(false)" style="background:#ccc; margin:0;">Pas encore</button>
                         </div>`
                    }
                </div>
            </div>

            <div style="margin-top:20px;">
                <h3>Accès Rapide</h3>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <button class="option-btn" onclick="router('zen')">🧘‍♀️ Espace Zen</button>
                    <button class="option-btn" onclick="router('nutrition')">🥑 Idées Repas</button>
                </div>
            </div>
        `;
    }

    function finishDailyQuiz(val) {
        state.quizDone = true;
        render(); // Re-render to show success
        if(val) alert("Super ! C'est la clé de la glycémie 🌟");
        else alert("Pas de souci, essaye demain !");
    }

    function resetQuiz() {
        state.quizDone = false;
        render();
    }

    // 2. DIAGNOSTIC COMPLET (10 Questions)
    const diagQuestions = [
        { q: "Tes cycles menstruels sont-ils réguliers ?", opts: ["Oui, comme une horloge", "Variables (quelques jours)", "Très irréguliers ou absents"] },
        { q: "Comment qualifierais-tu ton niveau d'énergie après le repas ?", opts: ["Stable", "Petit coup de mou", "Grosse fatigue / Envie de dormir"] },
        { q: "As-tu de l'acné (visage, dos) ?", opts: ["Jamais ou rarement", "Parfois (avant les règles)", "Oui, persistante et kystique"] },
        { q: "Constates-tu une pilosité excessive (visage, ventre) ?", opts: ["Non", "Un petit duvet", "Oui, c'est un complexe (Hirsutisme)"] },
        { q: "Perds-tu tes cheveux plus que la normale ?", opts: ["Non", "Un peu aux changements de saison", "Oui, perte diffuse ou golfes"] },
        { q: "Où stockes-tu le poids principalement ?", opts: ["Réparti équitablement", "Hanches et cuisses", "Ventre / Abdomen"] },
        { q: "As-tu des fringales de sucre incontrôlables ?", opts: ["Non", "Parfois", "Oui, souvent vers 17h ou le soir"] },
        { q: "Ton niveau de stress actuel sur 10 ?", opts: ["Zen (0-3)", "Modéré (4-7)", "Intense (8-10)"] },
        { q: "As-tu des antécédents de diabète dans la famille ?", opts: ["Non", "Je ne sais pas", "Oui (Parents/Grands-parents)"] },
        { q: "Comment est ta digestion ?", opts: ["Normale", "Ballonnements parfois", "Souvent gonflée après les repas"] }
    ];

    let currentQIdx = 0;

    function renderDiagStart(container) {
        container.innerHTML = `
            <div style="text-align:center;">
                <img src="https://cdn-icons-png.flaticon.com/512/3209/3209079.png" width="80" style="margin-bottom:20px;">
                <h2>Bilan Professionnel</h2>
                <p>Ce questionnaire de <strong>10 questions</strong> analyse tes symptômes (cycles, peau, métabolisme) pour définir ton profil dominant.</p>
                <div style="background:#fff3cd; padding:10px; border-radius:10px; font-size:0.8rem; margin: 20px 0;">
                    ⚠️ Ceci est un outil éducatif, pas un diagnostic médical.
                </div>
                <button class="btn-main" onclick="startDiag()">Commencer l'analyse</button>
            </div>
        `;
    }

    function startDiag() {
        currentQIdx = 0;
        state.diagAnswers = [];
        router('diag-question');
    }

    function renderDiagQuestion(container) {
        const q = diagQuestions[currentQIdx];
        const progress = ((currentQIdx + 1) / diagQuestions.length) * 100;
        
        container.innerHTML = `
            <div class="diag-progress"><div class="diag-bar" style="width:${progress}%"></div></div>
            <h3>Question ${currentQIdx + 1}/${diagQuestions.length}</h3>
            <h2 style="font-size:1.4rem; margin-bottom:30px;">${q.q}</h2>
            <div>
                ${q.opts.map((opt, idx) => `
                    <button class="option-btn" onclick="answerDiag(${idx})">
                        <div style="background:#eee; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem;">${String.fromCharCode(65+idx)}</div>
                        ${opt}
                    </button>
                `).join('')}
            </div>
        `;
    }

    function answerDiag(val) {
        state.diagAnswers.push(val); // 0=A, 1=B, 2=C
        if (currentQIdx < diagQuestions.length - 1) {
            currentQIdx++;
            render();
        } else {
            router('result');
        }
    }

    function renderResult(container) {
        // Calcul simple : majorité de C = Inflammation/Insuline
        const counts = {0:0, 1:0, 2:0};
        state.diagAnswers.forEach(a => counts[a]++);
        
        let profile = "Équilibré";
        let desc = "Tes symptômes semblent sous contrôle.";
        
        if (counts[2] >= 3) {
            profile = "Profil Inflammatoire / Résistant";
            desc = "Tes réponses indiquent une probable résistance à l'insuline et une inflammation. C'est la cause racine de la majorité des SOPK.";
        } else if (counts[1] >= 4) {
            profile = "Profil Mixte / Stress";
            desc = "Tu es en transition. Le stress et quelques écarts glycémiques impactent tes hormones.";
        }

        container.innerHTML = `
            <div style="text-align:center;">
                <h2>Ton Résultat</h2>
                <div style="background:var(--primary); color:white; padding:10px 20px; border-radius:50px; display:inline-block; margin-bottom:15px;">
                    ${profile}
                </div>
                <p>${desc}</p>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                
                <h3>Recommandations Immédiates :</h3>
                <ul style="text-align:left; color:#555; line-height:1.6;">
                    <li>🎯 <strong>Priorité :</strong> Stabiliser ta glycémie (voir menu Nutrition).</li>
                    <li>💊 <strong>Compléments :</strong> Parles-en à ton médecin (Inositol, Magnésium).</li>
                    <li>🩸 <strong>Analyses :</strong> Vérifier Taux Insuline à jeun et Testostérone.</li>
                </ul>

                <button class="btn-main" onclick="router('nutrition')">Voir le plan d'action Nutrition</button>
                <button class="btn-outline" onclick="startDiag()">Refaire le test</button>
            </div>
        `;
    }

    // 3. NUTRITION (RESTAURÉE AVEC IMAGES)
    function renderNutrition(container) {
        container.innerHTML = `
            <h2>L'Assiette SOPK 🥑</h2>
            <p>L'alimentation est ton premier médicament. Voici les piliers pour réduire les androgènes.</p>

            <div class="food-card">
                <img src="${images.salmon}" class="food-img" alt="Saumon">
                <div class="food-content">
                    <span class="food-tag">OMEGA-3</span>
                    <h3 style="margin-top:10px;">Le Gras, c'est la Vie !</h3>
                    <p style="font-size:0.9rem; color:#666;">Contrairement aux idées reçues, le bon gras (saumon, avocat, huile d'olive) est essentiel pour fabriquer des hormones saines.</p>
                </div>
            </div>

            <div class="food-card">
                <img src="${images.chocolate}" class="food-img" alt="Chocolat">
                <div class="food-content">
                    <span class="food-tag">PLAISIR & MAGNÉSIUM</span>
                    <h3 style="margin-top:10px;">Chocolat Noir 85%</h3>
                    <p style="font-size:0.9rem; color:#666;">Riche en magnésium (anti-stress) et pauvre en sucre. 2 carrés par jour sont excellents pour le moral et le SOPK.</p>
                </div>
            </div>

            <div class="advice-list">
                <div class="advice-item">
                    <div class="advice-icon">🥗</div>
                    <div>
                        <strong>Ordre des aliments</strong>
                        <p style="margin:0; font-size:0.85rem;">Fibres en premier, puis protéines, puis féculents. Cela lisse la courbe de sucre.</p>
                    </div>
                </div>
                <div class="advice-item">
                    <div class="advice-icon">🍳</div>
                    <div>
                        <strong>Petit-Déjeuner Salé</strong>
                        <p style="margin:0; font-size:0.85rem;">Impératif. Œufs, jambon ou fromage. Évite le sucre au réveil.</p>
                    </div>
                </div>
            </div>
        `;
    }

    // 4. GESTION DU STRESS (COMPLÉTÉE)
    function renderStress(container) {
        container.innerHTML = `
            <h2>Gestion du Stress 🧠</h2>
            <p>Le Cortisol est l'ennemi de la Progestérone. Il faut l'abaisser pour ovuler.</p>

            <div class="advice-list" style="margin-top:20px;">
                <div class="advice-item">
                    <div class="advice-icon">🏃‍♀️</div>
                    <div>
                        <strong>Le Sport Adapté</strong>
                        <p style="margin:5px 0 0 0; font-size:0.9rem;">
                            <strong>À faire :</strong> Renforcement musculaire (poids), Pilates, Yoga, Marche.
                            <br><span style="color:var(--primary); font-size:0.8rem;">Pourquoi ?</span> Le muscle consomme le glucose sans stresser le corps.
                            <br><strong>À éviter :</strong> Cardio intense (HIIT) tous les jours (augmente le cortisol).
                        </p>
                    </div>
                </div>

                <div class="advice-item">
                    <div class="advice-icon">💤</div>
                    <div>
                        <strong>Le Sommeil</strong>
                        <p style="margin:5px 0 0 0; font-size:0.9rem;">
                            Vise 7h à 8h. Le manque de sommeil augmente la résistance à l'insuline le lendemain de 30% !
                            <br><em>Astuce :</em> Arrête les écrans 1h avant de dormir.
                        </p>
                    </div>
                </div>

                <div class="advice-item">
                    <div class="advice-icon">🌿</div>
                    <div>
                        <strong>Suppléments Naturels</strong>
                        <p style="margin:5px 0 0 0; font-size:0.9rem;">
                            L'Ashwagandha et la Rhodiola sont des plantes adaptogènes qui aident le corps à résister au stress.
                        </p>
                    </div>
                </div>
            </div>
        `;
    }

    // 5. ESPACE ZEN (CŒUR + AUDIO FIX)
    let isPlaying = false;
    
    function renderZen(container) {
        container.innerHTML = `
            <div class="zen-container">
                <h2>Cohérence Cardiaque</h2>
                <p>Inspire quand le cœur grandit,<br>Expire quand il rétrécit.</p>
                
                <div id="heart-anim" class="heart-wrapper">
                    <div class="heart"></div>
                </div>

                <button id="zen-btn" class="btn-main" onclick="toggleZen()">Lancer la séance (5 min)</button>
                <p style="font-size:0.8rem; color:#999; margin-top:15px;">Le son aide à la relaxation 🎵</p>
            </div>
        `;
        // Reset state visual if returning to view
        isPlaying = false;
    }

    function toggleZen() {
        const audio = document.getElementById('zen-audio');
        const wrapper = document.getElementById('heart-anim');
        const btn = document.getElementById('zen-btn');

        if (!isPlaying) {
            // PLAY
            audio.play().catch(e => alert("Le navigateur a bloqué le son. Réessayez."));
            wrapper.classList.add('running');
            btn.innerText = "Arrêter / Pause";
            btn.style.background = "#aaa";
            isPlaying = true;
        } else {
            // PAUSE
            audio.pause();
            wrapper.classList.remove('running');
            btn.innerText = "Reprendre";
            btn.style.background = "var(--primary)";
            isPlaying = false;
        }
    }

    // Initial render
    render();

</script>
</body>
</html>
